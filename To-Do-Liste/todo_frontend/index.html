<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body onload="render()">
    <h1>To Do Liste</h1>

    <form onsubmit="addTodo(); return false">
        <input type="text" placeholder="Neues ToDo" id="todoinput">
        <button>Hinzufügen</button>
    </form>

    <ul id="todolist">

    </ul>

    <script>
        let todos = [
            'Einkaufen'
        ]

        function addTodo() {
            let todoText = todoinput.value
            todos.push(todoText)
            todoinput.value = "";
            save();
            render();
        }

        function render() {
            todolist.innerHTML = "";
            todos.forEach(todo => todolist.innerHTML += `<li>${todo}</li>`);
        }

        function save() {
            fetch('http://127.0.0.1/todos', {
                body: JSON.stringify(todos),
                method: 'PUT'
            });
        }
    </script>
</body>

</html>
