<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body onload="loadToDos()">
    <h1>To Do Liste</h1>

    <form onsubmit="addTodo(); return false">
        <input type="text" placeholder="Neues ToDo" id="todoinput">
        <button>Hinzufügen</button>
    </form>

    <ul id="todolist">

    </ul>

    <script>
        let todos = [];

        async function loadToDos() {
            const url = 'http://localhost:3000/todos';

            const resp = await fetch(url);
            todos = await resp.json();

            render();
        }

        async function addTodo() {
            const todoText = todoinput.value;

            const newTodo = {
                title: todoText
            };

            const savedTodo = await save(newTodo);

            todos.push(savedTodo);

            todoinput.value = "";

            render();
        }

        function render() {
            todolist.innerHTML = "";

            todos.forEach(todo => {
                todolist.innerHTML += `<li>${todo.title}</li>`;
            });
        }

        async function save(todo) {
            const response = await fetch('http://localhost:3000/todos', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(todo)
            });

            return await response.json();
        }
    </script>
</body>

</html>
